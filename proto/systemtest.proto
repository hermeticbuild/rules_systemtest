syntax = "proto3";

// TODO: split this into separate files.
package systemtest.v1;

option go_package = "github.com/hermeticbuild/rules_systemtest/src/proto/systemtestpb";

// ---------------------------------------------------------------------------
// Common data model
// ---------------------------------------------------------------------------

// A single value on the wire.
message Value {
  // JSON conforming to schema_id, tagged with the id of a schema the emitting
  // plugin advertises.
  message SchemaBlob {
    string schema_id = 1;
    bytes contents = 2;
  }
  oneof value {
    string str = 1;          // scalar; also JSON-encoded lists/dicts on inputs
    bytes data = 3;          // raw bytes (e.g. inlined file contents)
    SchemaBlob schema_blob = 4;
    int32 int_value = 5;     // integer scalar (protojson: a JSON number)
  }
}

message Empty {}

// Reuse/sharing policy for a fixture. See design "Reuse, sharing, and slots".
message Sharing {
  oneof use_scope {
    Empty unrestricted = 1;       // any client_id may reuse
    Empty client_restricted = 2;  // only the creating client_id (default)
    Empty single_use = 3;         // never reused
  }
  int64 maximum_concurrent_connections = 4;  // "slots"
}

enum LeaseStatus {
  LEASE_STATUS_UNKNOWN = 0;
  PENDING = 1;
  SUCCEEDED = 2;
  FAILED = 3;
}

// Lifecycle status of a provisioned fixture instance, as reported by the
// plugin's GetFixtureInfo. Drives the coordinator's reconciler.
enum InstanceStatus {
  INSTANCE_STATUS_UNKNOWN = 0;
  INSTANCE_STARTING = 1;       // created, not yet ready
  INSTANCE_RUNNING = 2;        // ready and healthy
  INSTANCE_SHUTTING_DOWN = 3;  // being torn down
  INSTANCE_ERROR = 4;          // terminal failure
  INSTANCE_DEFUNCT = 5;        // gone / unknown to the plugin
}

// The content-addressed recipe for a fixture.
message FixtureDescription {
  string impl_id = 1;
  oneof plugin {
    string binary_path = 2;    // local mode: runfiles path the coordinator starts
    string container_ref = 3;  // remote mode: digest-pinned (unused in scaffold)
  }
  map<string, Value> inputs = 4;
  repeated string image_inputs = 5;  // scaffold: unused
  repeated string file_inputs = 6;   // scaffold: unused
  Sharing sharing = 7;
  int64 startup_timeout_seconds = 8;
  string name = 9;  // human-readable; not part of identity
  string profile_id = 10;  // tenancy/budget profile; "" means "default". In the fingerprint.
}

// ---------------------------------------------------------------------------
// Runner <-> Coordinator
// ---------------------------------------------------------------------------

service CoordinatorService {
  rpc TakeLease(TakeLeaseRequest) returns (TakeLeaseResponse);
  rpc Keepalive(KeepaliveRequest) returns (KeepaliveResponse);
  rpc ReleaseLease(ReleaseRequest) returns (ReleaseResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message TakeLeaseRequest {
  FixtureDescription fixture = 1;  // fully resolved
  string client_id = 2;            // reuse key (advisory)
  string owner = 3;                // accounting only
  int64 ttl_seconds = 4;
  uint32 associated_tests_count = 5;
}

message TakeLeaseResponse {
  LeaseStatus status = 1;
  string lease_id = 2;
  map<string, Value> outputs = 3;      // only on SUCCEEDED; forwarded verbatim
  repeated string messages = 4;
  map<string, Value> credentials = 5;  // per-consumer access material; never persisted (currently empty)
}

message KeepaliveRequest { string lease_id = 1; }
message KeepaliveResponse {}
message ReleaseRequest { string lease_id = 1; }
message ReleaseResponse {}
message StatusRequest { string lease_id = 1; }
message StatusResponse {
  LeaseStatus status = 1;
  map<string, Value> outputs = 2;
  repeated string messages = 3;
  map<string, Value> credentials = 4;  // see TakeLeaseResponse.credentials (currently empty)
}

// ---------------------------------------------------------------------------
// Coordinator <-> Plugin
// ---------------------------------------------------------------------------

service CoordinatorPlugin {
  rpc DescribePlugin(Empty) returns (DescribeResponses);
  rpc GetResourcePool(CreateRequest) returns (ResourcePool);
  rpc GetResourceRequests(CreateRequest) returns (ResourceRequests);
  // Unary: returns as soon as creation is *initiated*. The coordinator's
  // reconciler drives readiness via GetFixtureInfo. May return a typed
  // RESOURCE_EXHAUSTED (gRPC code) carrying the exhausted pool_id in its
  // details when the infrastructure is authoritative over quota.
  rpc CreateFixture(CreateRequest) returns (CreateResponse);
  // Polled every tick: re-derives a fixture's status/outputs on demand.
  // Subsumes the old CreateProgress stream and HealthCheck.
  rpc GetFixtureInfo(GetFixtureInfoRequest) returns (GetFixtureInfoResponse);
  rpc DestroyFixture(DestroyRequest) returns (DestroyResponse);
  // Optional: per-consumer access material. Default impl may return
  // UNIMPLEMENTED, which the coordinator tolerates.
  rpc IssueAccessCredentials(IssueAccessCredentialsRequest) returns (IssueAccessCredentialsResponse);
  // Optional: early return of a finite per-consumer slice. UNIMPLEMENTED
  // tolerated; issuance validity is the backstop.
  rpc ReleaseAccessCredentials(ReleaseAccessCredentialsRequest) returns (Empty);
}

message DescribeResponses { repeated DescribeResponse responses = 1; }
message DescribeResponse {
  string impl_id = 1;
  string version = 2;
  map<string, string> schemas = 3;  // schema_id -> JSON Schema text
}

message CreationMetadata {
  string fixture_id = 1;  // stable id; key idempotency on this
  string client_id = 2;
  string owner = 3;
  map<string, string> labels = 4;
  uint32 attempt = 6;     // retry attempt (0-based)
}

message CreateRequest {
  string impl_id = 1;
  map<string, Value> inputs = 2;  // file contents already inlined
  CreationMetadata metadata = 3;
  bytes profile_config = 4;       // opaque operator blob, forwarded verbatim
}

message CreateResponse {
  bytes instance_data = 1;            // opaque; handed back to GetFixtureInfo/Destroy
  map<string, Value> outputs = 2;     // any immediately-known outputs
  repeated ResourcePool consumed = 3;
  int64 idle_timeout_seconds = 4;
  int64 max_lifetime_seconds = 5;     // absolute lifetime bound (0 = profile default)
}

message GetFixtureInfoRequest {
  string impl_id = 1;
  bytes instance_data = 2;
}
message GetFixtureInfoResponse {
  InstanceStatus status = 1;
  map<string, Value> outputs = 2;
  // High-level, human-readable status/error lines (e.g. an unhealthy verdict).
  // The plugin does not enumerate per-element detail or ship logs; the client
  // pulls those itself with the handed-over credentials.
  repeated string messages = 3;
  repeated ResourcePool consumed = 4;
}

message ResourceAmount {
  string name = 1;
  string unit = 2;
  int64 quantity = 3;
}
message ResourcePool {
  string pool_id = 1;
  repeated ResourceAmount resources = 2;
}
message ResourceRequests { repeated ResourcePool consumes = 1; }

message DestroyRequest {
  string impl_id = 1;
  bytes instance_data = 2;
}
message DestroyResponse {}

message IssueAccessCredentialsRequest {
  string impl_id = 1;
  bytes instance_data = 2;
  int64 validity_seconds = 4;  // lease TTL plus margin
}
message IssueAccessCredentialsResponse {
  map<string, Value> credentials = 1;
  bytes issued_handle = 2;  // opaque; passed back to ReleaseAccessCredentials
}
message ReleaseAccessCredentialsRequest {
  string impl_id = 1;
  bytes instance_data = 2;
  bytes issued_handle = 3;
}
