# Cargo workspace for the Rust services.
#
# After changing any dependency here:
#   CARGO_BAZEL_REPIN=1 bazel build //...
[workspace]
members = [
    "coordinator",
    "plugins/dummy",
    "proto/codegen",
    "proto/systemtestrs",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"  # tonic-generated service traits
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
itertools = "0.14"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
